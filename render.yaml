services:
  - type: web
    name: boltonbarbie
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: KICK_CHANNEL_SLUG
        value: boltonbarbie
      - key: IRL_ALLOWED_CATEGORIES
        value: IRL,Just Chatting,Travel & Outdoors,Food & Drink
